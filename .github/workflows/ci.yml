name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck -w @my-pay/engine
      - run: npm run build -w backend
      - run: npm run lint
      - run: npm test
      - run: npm run build -w frontend
        env:
          VITE_MOCK: 'on'
      - name: Production bundle excludes mock modules
        run: |
          if grep -R -I -n -F "mypay-mock:" frontend/dist; then
            echo "mock modules leaked into frontend/dist"
            exit 1
          fi
